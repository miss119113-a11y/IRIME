name: Frozen paper IRIME reproducibility
on:
  push:
    paths:
      - 'paper_frozen/**'
      - 'experiments/run_main.py'
      - 'experiments/paper_protocol.py'
      - 'tests/test_paper_frozen.py'
      - '.github/workflows/paper-frozen-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Historical-source checksum and frozen output fixtures
        run: python -m unittest discover -s tests -p test_paper_frozen.py -v
      - name: One-trial frozen principal-cell smoke test
        run: python -m experiments.run_main --estimator-version paper-frozen --family snr --condition=-5dB --trials 1 --out audit/frozen_snr_smoke
      - name: Assert recorded implementation version and data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('audit/frozen_snr_smoke')
          m=json.loads((d/'MANIFEST.json').read_text())
          assert m['estimator_version']=='paper-frozen'
          assert m['implementation_path']=='paper_frozen/irime.py'
          assert (d/'trials.csv').is_file() and (d/'summary.csv').is_file()
          print('Frozen IRIME smoke: version, manifest, trial data, and summary checked')
          PY
