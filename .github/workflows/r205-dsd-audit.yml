name: R205 DSD regression and paired impact audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'irime.py'
      - 'tests/**'
      - '.github/workflows/r205-dsd-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests (including legacy numerical fixtures)
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Paired R205 DSD impact audit
        run: python tests/r205_paired_audit.py --trials 5 --out audit/r205_dsd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r205-dsd-impact
          path: audit/r205_dsd/
          if-no-files-found: warn
