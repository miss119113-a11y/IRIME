name: Handicraft System CI
on:
  push:
    branches: [ handicraft-system-v1, handicraft-system-v2 ]
    paths: [ 'handicraft-system/**', '.github/workflows/handicraft-system-ci.yml' ]
  workflow_dispatch:
jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: handicraft_system }
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: handicraft_system
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: handicraft-system-ci-secret-key-must-be-long-enough-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Build backend
        run: mvn -q -f handicraft-system/backend/pom.xml clean package
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build frontend
        working-directory: handicraft-system/frontend
        run: npm install && npm run build
      - name: Install Chromium
        working-directory: handicraft-system/frontend
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Start system
        run: |
          nohup java -jar handicraft-system/backend/target/handicraft-system-0.0.1-SNAPSHOT.jar >/tmp/craft-backend.log 2>&1 &
          cd handicraft-system/frontend && nohup npm run dev -- --host 0.0.0.0 >/tmp/craft-frontend.log 2>&1 &
          for i in {1..50}; do if curl -fsS http://127.0.0.1:8080/api/works/featured >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null;then exit 0;fi;sleep 2;done
          cat /tmp/craft-backend.log;exit 1
      - name: API smoke full order lifecycle
        run: |
          U=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"user","password":"123456"}' http://127.0.0.1:8080/api/auth/login)
          UT=$(echo "$U"|python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          ORDERS=$(curl -fsS -H "Authorization: Bearer $UT" http://127.0.0.1:8080/api/orders)
          OID=$(echo "$ORDERS"|python3 -c "import sys,json;d=json.load(sys.stdin);print(next(x['id'] for x in d if x['status']=='待支付'))")
          curl -fsS -H "Authorization: Bearer $UT" -H 'Content-Type: application/json' -d '{"provider":"MOCK_WECHAT"}' http://127.0.0.1:8080/api/payments/order/$OID/pay
          C=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"creator","password":"123456"}' http://127.0.0.1:8080/api/auth/login)
          CT=$(echo "$C"|python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -fsS -X PUT -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' -d '{"progress":100,"text":"CI制作完成"}' http://127.0.0.1:8080/api/orders/$OID/progress
          curl -fsS -X POST -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' -d '{"carrier":"顺丰速运（模拟）","trackingNo":""}' http://127.0.0.1:8080/api/logistics/order/$OID/ship
          curl -fsS -X POST -H "Authorization: Bearer $CT" http://127.0.0.1:8080/api/logistics/order/$OID/advance
          curl -fsS -X POST -H "Authorization: Bearer $CT" http://127.0.0.1:8080/api/logistics/order/$OID/advance
          curl -fsS -X PUT -H "Authorization: Bearer $UT" http://127.0.0.1:8080/api/orders/$OID/complete
      - name: Capture V2 screenshots
        working-directory: handicraft-system/frontend
        run: node scripts/screenshot.mjs
      - name: Upload V2 screenshots
        uses: actions/upload-artifact@v4
        with: { name: handicraft-system-v2-preview, path: handicraft-system/frontend/screenshots/*.png, retention-days: 7 }
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handicraft-system-v2-logs
          path: |
            /tmp/craft-backend.log
            /tmp/craft-frontend.log
          retention-days: 7
