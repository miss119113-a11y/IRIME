name: Handicraft System CI
on:
  push:
    branches: [ handicraft-system-v1, handicraft-system-v2 ]
    paths: [ 'handicraft-system/**', '.github/workflows/handicraft-system-ci.yml' ]
  workflow_dispatch:
jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: handicraft_system }
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: handicraft_system
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: handicraft-system-ci-secret-key-must-be-long-enough-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Build backend
        run: mvn -q -f handicraft-system/backend/pom.xml clean package
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build frontend
        working-directory: handicraft-system/frontend
        run: npm install && npm run build
      - name: Start backend
        run: |
          nohup java -jar handicraft-system/backend/target/handicraft-system-0.0.1-SNAPSHOT.jar >/tmp/craft-backend.log 2>&1 &
          for i in {1..50}; do curl -fsS http://127.0.0.1:8080/api/works/featured >/dev/null && exit 0; sleep 2; done
          cat /tmp/craft-backend.log; exit 1
      - name: API smoke JWT
        run: |
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"user","password":"123456"}' http://127.0.0.1:8080/api/auth/login)
          TOKEN=$(echo "$LOGIN"|python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/auth/me
          curl -fsS -H "Authorization: Bearer $TOKEN" -X POST http://127.0.0.1:8080/api/favorites/work/1
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"rating":5,"content":"CI自动化评价"}' http://127.0.0.1:8080/api/reviews/work/1
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: handicraft-system-v2-logs, path: /tmp/craft-backend.log, retention-days: 7 }
